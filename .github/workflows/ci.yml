name: Toolkit CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check core behavior and original MIT license
        run: ./Tools/check.sh --geometry-only
      - name: Build and package universal app
        run: ./package.sh
      - name: Verify universal architecture and license resources
        run: |
          APP="build/Screen Measurement Toolkit.app"
          lipo "$APP/Contents/MacOS/ScreenMeasurementToolkit" -verify_arch arm64 x86_64
          cmp LICENSE "$APP/Contents/Resources/LICENSE.txt"
          cmp NOTICE "$APP/Contents/Resources/NOTICE.txt"
          codesign --verify --deep --strict "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: screen-measurement-toolkit-macOS
          path: build/dist/
